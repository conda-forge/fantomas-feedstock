context:
  version: "8.0.2"

package:
  name: fantomas
  version: ${{ version }}

source:
  url: https://github.com/fsprojects/fantomas/archive/v${{ version }}.tar.gz
  sha256: 951caf8e0056f649665eac7ef5febb52150ea62bef0ec8bd23f9980700734566

build:
  number: 0
  noarch: generic

requirements:
  host:
    - dotnet =8
    - nuget-license <3.1
  run:
    - dotnet =8

tests:
  - script:
      - fantomas --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE.md
    - license-files/
  summary: FSharp source code formatter
  homepage: https://fsprojects.github.io/fantomas
  repository: https://github.com/fsprojects/fantomas

extra:
  recipe-maintainers:
    - danielnachun
