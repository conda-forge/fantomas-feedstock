context:
  version: "8.0.4"

package:
  name: fantomas
  version: ${{ version }}

source:
  url: https://github.com/fsprojects/fantomas/archive/v${{ version }}.tar.gz
  sha256: b2f570971919579ee48420edc984d8c7e6f75f429b518829fc9cd445398c6b03

build:
  number: 0
  noarch: generic

requirements:
  host:
    - dotnet =8
    - nuget-license <3.1
  run:
    - dotnet =8

tests:
  - script:
      - fantomas --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE.md
    - license-files/
  summary: FSharp source code formatter
  homepage: https://fsprojects.github.io/fantomas
  repository: https://github.com/fsprojects/fantomas

extra:
  recipe-maintainers:
    - danielnachun
